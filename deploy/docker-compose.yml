version: '3.8'

services:
  web:
    image: rep12/server:latest
    build:
      context: ..
      dockerfile: extras/docker/production/Dockerfile
    restart: always
    env_file: .env
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}
    volumes:
      - static:/home/wger/static
      - media:/home/wger/media
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8000/api/v2/version/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - web

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rep12}
      POSTGRES_USER: ${POSTGRES_USER:-rep12}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-rep12}
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis:/data

  celery-worker:
    image: rep12/server:latest
    restart: always
    env_file: .env
    command: /start-worker
    depends_on:
      - db
      - cache

  celery-beat:
    image: rep12/server:latest
    restart: always
    env_file: .env
    command: /start-beat
    depends_on:
      - db
      - cache

  livekit:
    image: livekit/livekit-server:latest
    restart: always
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50200:50000-50200/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

volumes:
  pgdata:
  static:
  media:
  redis:
  certbot-www:
  certbot-conf:
